services:
  fastapi:
    build: .
    container_name: tcq-api
    ports:
      - "6767:6767"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
    command: python -m uvicorn backend.src.main:app --host 0.0.0.0 --port 6767 --reload
    env_file:
      - .env

  frontend:
    image: node:20-alpine
    container_name: tcq-frontend
    working_dir: /app/backend/src/Frontend
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - fastapi
